[workspace]
resolver = "3"
members = [
    "crates/laconic-grammars",
    "crates/laconic-engine",
    "crates/laconic-packs",
    "crates/laconic-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
laconic-grammars = { path = "crates/laconic-grammars" }
laconic-engine = { path = "crates/laconic-engine" }
laconic-packs = { path = "crates/laconic-packs" }
tree-sitter = "=0.26.12"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-java = "=0.23.5"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
